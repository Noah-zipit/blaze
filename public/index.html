<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0c" />
<meta name="description" content="Blaze — a fast 2-3 player browser FPS. Create a room, share the code, and fight." />
<title>Blaze — Browser FPS</title>
<link rel="stylesheet" href="css/style.css" />
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>

<!-- shared Blaze logo (inline SVG, ember flame) -->
<template id="blaze-logo-tpl">
<svg class="blaze-mark" viewBox="0 0 72 72" aria-hidden="true">
  <defs>
    <linearGradient id="bz-outer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a1a"/><stop offset="1" stop-color="#e01f0e"/>
    </linearGradient>
    <linearGradient id="bz-inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23e"/><stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
    <radialGradient id="bz-glow" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#ff6b35" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="36" cy="38" r="30" fill="url(#bz-glow)"/>
  <!-- angular outer flame -->
  <path fill="url(#bz-outer)" d="M36 6 L41 18 L48 14 L44 26 L54 30 L46 38 L52 46
    A20 20 0 1 1 20 46 L26 38 L18 30 L28 26 L24 14 L31 18 Z"/>
  <!-- inner flame -->
  <path fill="url(#bz-inner)" d="M36 28 L39 36 L44 34 L41 41 L45 45
    A9.5 9.5 0 1 1 27 45 L31 41 L28 34 L33 36 Z"/>
  <!-- white-hot core -->
  <path fill="#fff7e8" d="M36 42 L38 47 L36 52 L34 47 Z"/>
</svg>
</template>

<!-- ============ HOME ============ -->
<section id="screen-home" class="screen active">
  <div class="menu-card">
    <div class="logo-wrap" id="home-logo"></div>
    <h1 class="wordmark">BLAZE</h1>
    <p class="tagline">2–3 player browser warfare. No downloads.</p>

    <label class="field-label" for="username">CALLSIGN</label>
    <input id="username" class="text-input" maxlength="16" placeholder="e.g. ghost_47"
           autocomplete="off" autocapitalize="off" spellcheck="false" />

    <button id="btn-create" class="btn btn-primary">CREATE ROOM</button>

    <div class="divider"><span>or join a squad</span></div>

    <div class="join-row">
      <input id="room-code" class="text-input code-input" maxlength="6" placeholder="CODE"
             autocomplete="off" autocapitalize="characters" spellcheck="false" />
      <button id="btn-join" class="btn btn-ghost">JOIN</button>
    </div>
    <p id="home-error" class="error-msg"></p>
  </div>
</section>

<!-- ============ LOADOUT ============ -->
<section id="screen-loadout" class="screen">
  <div class="menu-card wide">
    <div class="loadout-head">
      <div class="logo-wrap small" id="loadout-logo"></div>
      <div>
        <h2>LOADOUT</h2>
        <p class="tagline">Pick your weapon, <span id="loadout-user" class="accent"></span></p>
      </div>
    </div>

    <div class="weapon-grid">
      <button class="weapon-card" data-weapon="rifle">
        <svg class="weapon-icon" viewBox="0 0 64 24" aria-hidden="true">
          <path fill="currentColor" d="M2 14 h34 l4 -6 h6 l2 6 h8 v4 h-10 l-2 4 h-8 l2 -4 h-8 l-3 5 h-9 l3 -5 H2 Z"/>
          <rect x="46" y="8" width="6" height="3" fill="currentColor"/>
        </svg>
        <h3>ASSAULT RIFLE</h3><p class="wdesc">Balanced. Reliable at any range.</p>
        <div class="stat"><span>DMG</span><div class="bar"><i style="width:55%"></i></div></div>
        <div class="stat"><span>RATE</span><div class="bar"><i style="width:70%"></i></div></div>
        <div class="stat"><span>MAG</span><div class="bar"><i style="width:60%"></i></div><b>30</b></div>
      </button>

      <button class="weapon-card" data-weapon="smg">
        <svg class="weapon-icon" viewBox="0 0 64 24" aria-hidden="true">
          <path fill="currentColor" d="M4 12 h22 l3 -5 h8 l2 5 h12 v5 h-9 l-2 4 h-7 l2 -4 h-6 l-3 4 h-8 l2 -4 H4 Z"/>
        </svg>
        <h3>SMG</h3><p class="wdesc">Bullet hose. Shreds up close.</p>
        <div class="stat"><span>DMG</span><div class="bar"><i style="width:32%"></i></div></div>
        <div class="stat"><span>RATE</span><div class="bar"><i style="width:100%"></i></div></div>
        <div class="stat"><span>MAG</span><div class="bar"><i style="width:80%"></i></div><b>40</b></div>
      </button>

      <button class="weapon-card" data-weapon="sniper">
        <svg class="weapon-icon" viewBox="0 0 64 24" aria-hidden="true">
          <path fill="currentColor" d="M2 11 h30 l14 -4 h12 v3 h-8 l-6 3 h6 v3 h-14 l-4 -2 h-28 Z"/>
          <circle cx="40" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
        </svg>
        <h3>SNIPER</h3><p class="wdesc">One shot, one kill. Scope to aim.</p>
        <div class="stat"><span>DMG</span><div class="bar"><i style="width:100%"></i></div></div>
        <div class="stat"><span>RATE</span><div class="bar"><i style="width:18%"></i></div></div>
        <div class="stat"><span>MAG</span><div class="bar"><i style="width:14%"></i></div><b>5</b></div>
      </button>
    </div>

    <div class="loadout-actions">
      <button id="btn-loadout-back" class="btn btn-ghost">BACK</button>
      <button id="btn-start" class="btn btn-primary big">START MATCH</button>
    </div>
    <p id="loadout-error" class="error-msg"></p>
  </div>
</section>

<!-- ============ GAME ============ -->
<section id="screen-game" class="screen">
  <canvas id="game-canvas"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div id="crosshair"><span></span></div>
    <div id="hitmarker"></div>

    <div id="hud-top">
      <div id="room-chip" title="Tap to copy">ROOM <b id="room-code-hud">------</b></div>
      <div id="timer">5:00</div>
      <div id="hud-top-right">
        <button id="btn-scoreboard" class="icon-btn" title="Scoreboard">☰</button>
        <button id="btn-mute" class="icon-btn" title="Mute">🔊</button>
      </div>
    </div>

    <div id="killfeed"></div>

    <div id="hud-bottom">
      <div id="health-wrap">
        <div id="health-bar"><i></i></div>
        <span id="health-num">100</span>
      </div>
      <div id="ammo-wrap"><span id="ammo">30</span><span class="ammo-sub">/ 30</span></div>
    </div>

    <!-- touch controls -->
    <div id="touch-ui" class="hidden">
      <div id="joystick"><div id="stick"></div></div>
      <div id="touch-buttons">
        <button id="btn-aim" class="touch-btn">AIM</button>
        <button id="btn-reload-touch" class="touch-btn">R</button>
        <button id="btn-fire" class="touch-btn fire">FIRE</button>
      </div>
    </div>

    <div id="death-overlay" class="hidden">
      <h2>ELIMINATED</h2><p>Respawning…</p>
    </div>

    <div id="scoreboard" class="hidden">
      <h2>SCOREBOARD</h2>
      <table id="score-table"><thead><tr><th>PLAYER</th><th>K</th><th>D</th></tr></thead><tbody></tbody></table>
      <p class="hint">hold TAB / tap ☰</p>
    </div>
  </div>

  <div id="connecting" class="hidden"><div class="spinner"></div><p>Connecting…</p></div>
</section>

<!-- ============ MATCH END ============ -->
<section id="screen-end" class="screen">
  <div class="menu-card">
    <div class="logo-wrap small" id="end-logo"></div>
    <h2 id="end-title">TIME UP</h2>
    <table id="end-table"><thead><tr><th>PLAYER</th><th>K</th><th>D</th></tr></thead><tbody></tbody></table>
    <button id="btn-again" class="btn btn-primary big">PLAY AGAIN</button>
    <button id="btn-home" class="btn btn-ghost">HOME</button>
  </div>
</section>

<!-- rotate prompt -->
<div id="rotate-overlay" class="hidden">
  <div class="rotate-phone">📱</div>
  <h2>ROTATE YOUR DEVICE</h2>
  <p>Blaze plays in landscape</p>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>

# Blaze on Cloudflare Workers — wrangler config.
#
# Free tier, no credit card: Workers free plan includes Durable Objects.
# DOs on the free tier use SQLite storage only (fine — rooms are ephemeral;
# the roster is persisted so a room survives isolate eviction).
# Workers never "sleep": no keep-warm ping is needed, unlike Render/Koyeb.

name = "blaze"
account_id = "e5412bc12dc3c405ce91578e9b385925"
main = "worker/worker.js"
compatibility_date = "2026-09-01"

# Static game client served from the edge.
[assets]
directory = "public"

[durable_objects]

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "ROOM_REGISTRY"
class_name = "RoomRegistry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom", "RoomRegistry"]
